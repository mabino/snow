name: Web frontend

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - 'core/**'
      - 'nat/**'
      - 'bridge/**'
      - 'frontend_web/**'
      - 'Cargo.*'
      - '.cargo/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'core/**'
      - 'nat/**'
      - 'bridge/**'
      - 'frontend_web/**'
      - 'Cargo.*'
      - '.cargo/**'
      - '.github/workflows/web.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build test image (wasm frontend + snow-bridge)
        run: docker build -f frontend_web/Dockerfile --target test -t snow-web-test .
      - name: Run tests (Rust, JavaScript, bridge protocol, browser end-to-end)
        run: docker run --rm snow-web-test
